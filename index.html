<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script/aframe.min.js"></script>
    <script src="./script/ada-water.js"></script>
    <script src="./script/aframe-extras.min.js"></script>
    <title>Ike's FUTURE HOUSE</title>
</head>
<body>
    
    <div id="teleport-ui" style="position:fixed; bottom:10px; right:10px; z-index:1000; background:rgba(0,0,0,0.7); color:white; padding:15px; border-radius:10px; font-family:Arial; min-width:150px; box-shadow:0 4px 8px rgba(0,0,0,0.5); max-height:80vh; overflow-y:auto;">
      <h4 style="margin:0 0 10px 0; text-align:center;">🏠 House Tour</h4>
      <button onclick="tp('0 1.6 4')" style="width:100%; margin:2px 0; padding:5px; background:#4CAF50; color:white; border:none; border-radius:5px; cursor:pointer;">🏠 Ground Floor</button>

      <button onclick="tp('0 7 4')" style="width:100%; margin:2px 0; padding:5px; background:#2196F3; color:white; border:none; border-radius:5px; cursor:pointer;">🆙 First Floor</button>
      <button onclick="tp('0 2 -12')" style="width:100%; margin:2px 0; padding:5px; background:#F44336; color:white; border:none; border-radius:5px; cursor:pointer;">🌳 Backyard</button>
      <button onclick="tp('0 15 25')" style="width:100%; margin:2px 0; padding:5px; background:#607D8B; color:white; border:none; border-radius:5px; cursor:pointer;">👁️ Overview</button>
      <button onclick="tp('50 5 5')" style="width:100%; margin:2px 0; padding:5px; background:#009688; color:white; border:none; border-radius:5px; cursor:pointer;">🏊 Pool</button>
    </div>
    
    <a-scene>

<a-camera id="camera" position="-10.7 3 85" look-controls wasd-controls="acceleration:65" movement-controls="fly: true; speed: 0.1"></a-camera>

        <a-sky src="assets/wallpaperflare.com_wallpaper.jpg"></a-sky>
        <a-box height="300" width="400" rotation="90 0 0" depth="0.5" position="-2 -1 10" src="assets/ddd.jpg" color="khaki"></a-box>
        <a-box height="25" width="38" depth="0.2" position="-20 16.6 22" rotation="90 0 0" color="gray" src="assets/model/house/ddd.jpeg"></a-box>
        <a-box height="8" width="22" position="-26 -0.4 50" depth="0.5" rotation="90 0 0" src="assets/ddd.jpg" color="orange"></a-box>
        
        <!--light-->
        <a-sphere radius="0.5" position="45 9 45" light="type:directional; intensity:0.4; color:yellow"></a-sphere>
        <a-sphere radius="0.5" position="8 10 20" light="type:point; intensity:1; color:red"></a-sphere>
        <a-sphere radius="0.5" position="8 10 40" light="type:spot; intensity:1; color:pink"></a-sphere>
        <a-entity light="type:point; intensity:4; distance:1 "></a-entity>
        <!--assets-->
       <a-assets>
<a-asset-item id="house" src="assets/model/house/scene.gltf"></a-asset-item>

        </a-assets>



        <!--light-->
        <a-entity light="type:ambient; intensity:0.2" ></a-entity>
        <a-entity light="type:spot; intensity:10; distance:20;" position="59 0 75" rotation="0 70 0"></a-entity>
        <a-entity light="type:spot; intensity:3;" position="-60 -1 75" rotation="0 10 0"></a-entity>
<a-entity light="type:point; intensity:0.2" position="-10 20 75"></a-entity>

        <!-- Interior lights - Brown tint -->
        <a-entity light="type: point; intensity: 0.6; color: #D2B48C; distance: 50" position="0 4 5"></a-entity>
        <a-entity light="type: point; intensity: 0.5; color: #DEB887; distance: 50" position="8 3 -5"></a-entity>
        <a-entity light="type: point; intensity: 0.5; color: #F4A460; distance: 50" position="-8 3 8"></a-entity>

        

        <!--house-->


       <a-entity gltf-model="#house" position="0 -0.7 0" scale="2 2 2" shadow="cast:true"></a-entity>






       



       

       <!--fence-->
        <a-entity gltf-model="#fence" position="-60 3.1 30" scale="0.065 0.0085 0.015" rotation="0 -90 0"></a-entity>
        <a-entity gltf-model="#fence" position="60 3 30" scale="0.065 0.0085 0.015" rotation="0 90 0"></a-entity>
        <a-entity gltf-model="#fence" position="0 3 -17.5" scale="0.085 0.0085 0.015" rotation="0 180 0"></a-entity>
        <a-entity gltf-model="#fence" position="-41.5 3 76" scale="0.025 0.0085 0.015" rotation="0 0 0"></a-entity>
        <a-entity gltf-model="#fence" position="31.1 3 76" scale="0.04 0.0085 0.0151" rotation="0 0 0"></a-entity>


        <!--gate-->
        <a-entity gltf-model="#gate" position="-10.7 5 76" scale="1.25 1.4 1" shadow="cast:true"></a-entity>

        <!--rangerover-->

        <a-entity gltf-model="#range" position="50 0.5 47" scale="3.2 3.5 2" shadow="true"></a-entity>
        <a-entity gltf-model="#range" position="40 0.51 47" scale="3.2 3.5 2" shadow="cast:true"></a-entity>

        <a-entity gltf-model="#range" position="40 0.51 47" scale="3.2 3.5 2" shadow="cast:true"></a-entity>
        <a-entity gltf-model="#mclaren" position="-23 -0.91 60" scale="3 3 3" rotation="0 90 0" shadow="cast:true"></a-entity>

        <!--carcanopy-->
        <a-entity gltf-model="#carcanopy" scale="3 3.8 5.5" position="45 -0.7 45" rotation="0 90 0"></a-entity>

        <!--poolsidechairs-->
        <a-entity gltf-model="#setup" position="48 -0.8 17" scale="0.005 0.005 0.005"></a-entity>
        <a-entity gltf-model="#swingchair" position="34 -0.71 6" scale="0.02 0.02 0.02"></a-entity>
        <a-entity gltf-model="#swingchair" position="34 -0.71 1" scale="0.02 0.02 0.02"></a-entity>

        <!--parasol-->
        <a-entity gltf-model="#parasol" position="36 -1 -17.5" scale="5 6 5" rotation="0 97 0" light="type:point; intensity:1;"></a-entity>
        
        <!--streetlight-->
        <a-entity gltf-model="#streetlight" position="59 -1 75" scale="0.004 0.004 0.004" ></a-entity>
        <a-entity gltf-model="#streetlight" rotation="0 200 0" position="-60 -1 75" scale="0.004 0.004 0.004" light="type:spot; intensity:1; color:khaki"></a-entity>


        <!--pool-->
        <a-entity scale="0.8 1 1" position="11 -0.5 1.9">
            <a-box height="18" width="13" rotation="90 0 0" position="50 0 0" depth="0.5" src="assets/floor.jpg"></a-box>
            <a-box height="5" width="18" rotation="0 90 0" position="57 2 0" src="assets/b.webp"></a-box>
            <a-box height="5" width="18" rotation="0 90 0" position="44 2 0" src="assets/b.webp"></a-box>
            <a-box height="5" width="14" position="50.5 2 -9" src="assets/b.webp"></a-box>
            <a-box height="5" width="14" position="50.5 2 9" src="assets/b.webp"></a-box>
            <a-box height="18" width="5" position="41 -0.5 0" rotation="90 0 0" src="assets/b.webp"></a-box>
            <a-box height="18" width="4" position="42 1.1 0" depth="1.5" rotation="90 0 0" src="assets/b.webp"></a-box>
            <a-box height="18" width="3" position="43 2.3 0" depth="1.5" rotation="90 0 0" src="assets/b.webp"></a-box>
        </a-entity>
        <!--water-->
        <a-water
        opacity="40"
        side="double"
        width="18.2"
        height="10"
        color="lightblue"
        src="assets/water3.jpg"
        repeat="2"
        depth="2"
        voronoi-points="11"
        rotation="90 90 0"
        position="51.5 3.95 2"
      >
      </a-water>
    </a-scene>

<script>
      function tp(pos) {
        document.querySelector('#camera').setAttribute('position', pos);
      }


      document.querySelector("a-water").setAttribute("animation", {
        property: "positions",
         from: "10 2 1",
         to: "2 15 2",
        dur: 2,
        loop: false,
        dir: "alternate",
        easing: "easeOutElastic",
      });
    </script>
  </body>
</html>
